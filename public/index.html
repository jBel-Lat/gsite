<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSITE Student Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    :root {
      --student-primary: #3b82f6;
      --student-card: rgba(30, 41, 59, 0.7);
    }

    .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    @media (max-width: 992px) { .main-layout { grid-template-columns: 1fr; } }

    .announcement-section { display: flex; flex-direction: column; gap: 20px; }
    .section-title {
      font-size: 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid var(--student-primary);
      padding-bottom: 10px;
    }

    .post-card {
      background: var(--student-card);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .post-card:hover { transform: translateY(-5px); border-color: var(--student-primary); }
    .post-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12px; color: var(--text-muted); }
    .comment-list { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
    .comment-item { background: rgba(255,255,255,0.02); padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 12px; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .author-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.1);
    }

    .post-image {
      width: 100%;
      border-radius: 12px;
      margin-top: 15px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .empty-state {
      color: var(--text-muted);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="dashboard-wrapper">
    <div class="main-content full-width">
      <main class="content-area">
        <div id="messageBox"></div>

        <div class="main-layout">
          <div class="announcement-section">
            <h2 class="section-title"><i class="fas fa-photo-video" style="color:#f59e0b;"></i> Multimedia Team Announcements</h2>
            <div id="multimediaPosts"></div>
          </div>

          <div class="announcement-section">
            <h2 class="section-title"><i class="fas fa-code" style="color:#3b82f6;"></i> Developer Team Announcements</h2>
            <div id="developerPosts"></div>
          </div>
        </div>

        <div style="margin-top:50px;">
          <h2 class="section-title"><i class="fas fa-calendar-day"></i> Upcoming Events</h2>
          <div id="eventsGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px;"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="regModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="eventTitleModal">
    <div class="panel" style="width:100%; max-width:440px;">
      <div class="panel-header">
        <h3 class="panel-title">Register for <span id="eventTitleModal"></span></h3>
        <button type="button" id="closeRegModalBtn" style="background:none; border:none; color:var(--text-muted);">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <form id="regForm">
        <input type="hidden" name="event_id" id="regEventId">
        <div class="form-group"><label for="fullName">Full Name</label><input id="fullName" type="text" name="full_name" class="form-control" required></div>
        <div class="form-group"><label for="email">Email</label><input id="email" type="email" name="email" class="form-control" required></div>
        <div class="form-group"><label for="contactNumber">Contact</label><input id="contactNumber" type="text" name="contact_number" class="form-control" required></div>
        <div class="grid-cards">
          <div class="form-group"><label for="studentId">ID Number</label><input id="studentId" type="text" name="student_id" class="form-control" required></div>
          <div class="form-group"><label for="yearSection">Year/Section</label><input id="yearSection" type="text" name="year_section" class="form-control" required></div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2">Submit</button>
      </form>
    </div>
  </div>

  <script>
    const state = {
      multimediaPosts: [],
      developerPosts: [],
      comments: {},
      events: []
    };

    const messageBox = document.getElementById('messageBox');
    const multimediaContainer = document.getElementById('multimediaPosts');
    const developerContainer = document.getElementById('developerPosts');
    const eventsGrid = document.getElementById('eventsGrid');
    const regModal = document.getElementById('regModal');
    const regForm = document.getElementById('regForm');
    const regEventId = document.getElementById('regEventId');
    const eventTitleModal = document.getElementById('eventTitleModal');

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function nl2br(value) {
      return escapeHtml(value).replace(/\n/g, '<br>');
    }

    function formatDate(value, withYear = true) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const options = withYear
        ? { month: 'short', day: '2-digit', year: 'numeric' }
        : { month: 'short', day: '2-digit' };
      return date.toLocaleDateString('en-US', options);
    }

    function showMessage(type, text) {
      if (!text) {
        messageBox.innerHTML = '';
        return;
      }
      const typeClass = type === 'error' ? 'alert-danger' : 'alert-success';
      messageBox.innerHTML = `<div class="alert ${typeClass}">${escapeHtml(text)}</div>`;
    }

    function authorAvatar(post, colorHex) {
      if (post.author_image && post.author_image !== 'default.png') {
        if (post.author_image.startsWith('http')) return post.author_image;
        return `/${post.author_image.replace(/^\/+/, '')}`;
      }
      const name = encodeURIComponent(post.author_name || 'User');
      return `https://ui-avatars.com/api/?name=${name}&background=${colorHex}&color=fff`;
    }

    function renderPosts(posts, container, label, colorHex) {
      if (!posts.length) {
        container.innerHTML = `<p class="empty-state">No announcements from ${escapeHtml(label)} Team.</p>`;
        return;
      }

      container.innerHTML = posts.map((post) => {
        const postComments = state.comments[post.id] || [];
        const commentsHtml = postComments.map((comment) => `
          <div class="comment-item">
            <strong style="color:var(--student-primary);">${escapeHtml(comment.author_name)}</strong>
            <div style="margin-top:2px; opacity:0.9;">${nl2br(comment.comment)}</div>
          </div>
        `).join('');

        const imageSrc = post.image
          ? (String(post.image).includes('/')
            ? `/${String(post.image).replace(/^\/+/, '')}`
            : `/uploads/posts/${encodeURIComponent(post.image)}`)
          : '';
        const imageHtml = imageSrc ? `<img src="${imageSrc}" class="post-image" alt="Post">` : '';
        const commentFormHtml = post.allow_comments === false
          ? '<p style="font-size:12px; opacity:0.8;">Comments are disabled for this announcement.</p>'
          : `
              <form class="comment-form" data-post-id="${post.id}" style="display:flex; gap:8px; margin-top:10px;">
                <input type="text" name="name" class="form-control form-control-sm" placeholder="Your Name" style="width:120px;" required>
                <input type="text" name="comment" class="form-control form-control-sm" placeholder="Add comment..." required>
                <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-paper-plane"></i></button>
              </form>
            `;

        return `
          <div class="post-card">
            <div class="post-meta">
              <img src="${authorAvatar(post, colorHex)}" class="author-avatar" alt="Author">
              <div style="display:flex; flex-direction:column; gap:2px;">
                <span style="color:#${colorHex}; font-weight:700; font-size:11px;">${escapeHtml(label.toUpperCase())} TEAM</span>
                <span style="font-size:10px; opacity:0.7;">${formatDate(post.created_at, true)}</span>
              </div>
            </div>
            <h3 style="font-size:18px; margin-bottom:10px;">${escapeHtml(post.title)}</h3>
            ${imageHtml}
            <div style="font-size:14px; line-height:1.5; color:rgba(255,255,255,0.8); margin-top:10px;">
              ${nl2br(post.details)}
            </div>
            <div class="comment-list">
              ${commentsHtml}
              ${commentFormHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderEvents() {
      if (!state.events.length) {
        eventsGrid.innerHTML = '<p class="empty-state">No upcoming events.</p>';
        return;
      }

      eventsGrid.innerHTML = state.events.map((eventItem) => `
        <div class="post-card" style="display:flex; flex-direction:column; justify-content:space-between;">
          <div>
            <h4 style="margin-bottom:10px;">${escapeHtml(eventItem.title)}</h4>
            <p style="font-size:13px; color:var(--text-muted);">${formatDate(eventItem.start_date, false)} - ${formatDate(eventItem.end_date, true)}</p>
          </div>
          <button class="btn btn-primary btn-sm w-100 open-reg-btn" type="button"
            data-event-id="${eventItem.id}" data-event-title="${escapeHtml(eventItem.title)}">Register Now</button>
        </div>
      `).join('');
    }

    function renderAll() {
      renderPosts(state.multimediaPosts, multimediaContainer, 'Multimedia', 'f59e0b');
      renderPosts(state.developerPosts, developerContainer, 'Developer', '3b82f6');
      renderEvents();
    }

    async function loadDashboardData() {
      try {
        const response = await fetch('/api/student/dashboard-data', { headers: { Accept: 'application/json' } });
        if (!response.ok) {
          let reason = `HTTP ${response.status}`;
          try {
            const payload = await response.json();
            if (payload && payload.error) reason = payload.error;
          } catch (_ignore) {
            // Keep default reason when response is not JSON.
          }
          throw new Error(reason);
        }
        const data = await response.json();

        state.multimediaPosts = Array.isArray(data.multimedia_posts) ? data.multimedia_posts : [];
        state.developerPosts = Array.isArray(data.developer_posts) ? data.developer_posts : [];
        state.comments = data.comments && typeof data.comments === 'object' ? data.comments : {};
        state.events = Array.isArray(data.events) ? data.events : [];
        showMessage('', '');
      } catch (_err) {
        state.multimediaPosts = [];
        state.developerPosts = [];
        state.comments = {};
        state.events = [];
        // Keep the page clean and render empty-state cards when API is temporarily unavailable.
        showMessage('', '');
      }

      renderAll();
    }

    function openRegModal(id, title) {
      regEventId.value = id;
      eventTitleModal.textContent = title;
      regModal.style.display = 'flex';
    }

    function closeRegModal() {
      regModal.style.display = 'none';
      regForm.reset();
    }

    document.addEventListener('click', (event) => {
      const openBtn = event.target.closest('.open-reg-btn');
      if (openBtn) {
        const eventId = openBtn.getAttribute('data-event-id');
        const title = openBtn.getAttribute('data-event-title');
        openRegModal(eventId, title);
      }

      if (event.target.id === 'closeRegModalBtn' || event.target === regModal) {
        closeRegModal();
      }
    });

    document.addEventListener('submit', async (event) => {
      const commentForm = event.target.closest('.comment-form');
      if (!commentForm) return;
      event.preventDefault();

      const formData = new FormData(commentForm);
      const payload = {
        post_id: Number(commentForm.getAttribute('data-post-id')),
        name: formData.get('name'),
        comment: formData.get('comment')
      };

      if (!Number.isFinite(payload.post_id) || payload.post_id <= 0) {
        showMessage('error', 'Comments are disabled for this announcement.');
        return;
      }

      try {
        const response = await fetch('/api/student/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        showMessage('success', 'Comment submitted.');
        await loadDashboardData();
      } catch (_err) {
        showMessage('error', 'Unable to submit comment right now. Please try again.');
      }
    });

    regForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const formData = new FormData(regForm);
      const payload = Object.fromEntries(formData.entries());
      payload.event_id = Number(payload.event_id);

      try {
        const response = await fetch('/api/student/register-event', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        closeRegModal();
        showMessage('success', 'Event registration submitted.');
      } catch (_err) {
        showMessage('error', 'Unable to submit registration right now. Please try again.');
      }
    });

    loadDashboardData();
  </script>
</body>
</html>
