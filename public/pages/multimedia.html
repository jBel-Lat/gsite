<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
</head>
<body>
  <p>Redirecting to your multimedia dashboard...</p>
  <script>
    (function () {
      var normalizeRole = function (rawRole) {
        var role = String(rawRole || '').toLowerCase().trim().replace(/\s+/g, '_');
        if (!role) return '';
        var aliases = {
          'multimedia-head': 'multimedia_head',
          multimedia: 'multimedia_head',
          media_head: 'multimedia_head'
        };
        return aliases[role] || role;
      };

      var role = normalizeRole(localStorage.getItem('role') || sessionStorage.getItem('role') || '');
      var headRoles = ['multimedia_head', 'admin', 'superadmin'];
      var teamRoles = ['photographer', 'videographer', 'graphic_designer', 'documentator', 'multimedia_member', 'multimedia'];
      var target = '/';

      if (headRoles.indexOf(role) !== -1) {
        target = '/pages/multimedia-head.html';
      } else if (teamRoles.indexOf(role) !== -1) {
        target = '/pages/multimedia-team.html';
      }

      window.location.replace(target);
    })();
  </script>
</body>
</html>
