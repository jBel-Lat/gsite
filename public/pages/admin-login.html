<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-login="true">
  <div class="main-content full-width" style="margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;">
    <div class="panel" style="width:min(420px,100%);">
      <div class="panel-header"><h3 class="panel-title">Admin Login</h3></div>
      <form id="loginForm">
        <div class="form-group"><label>Username</label><input class="form-control" name="username" required></div>
        <div class="form-group"><label>Password</label><input class="form-control" name="password" type="password" required></div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
      <p id="errorText" class="alert alert-danger" style="display:none; margin-top:12px;"></p>
      <p style="margin-top:12px;"><a href="/superadmin/login">Login as superadmin</a></p>
    </div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorText = document.getElementById('errorText');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorText.style.display = 'none';
      const payload = Object.fromEntries(new FormData(form).entries());
      payload.scope = 'admin';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok || data.ok === false) {
          throw new Error(data.error || 'Login failed');
        }
        if (data.user.role.includes('developer')) window.location.href = '/developer/dashboard';
        else if (data.user.role.includes('multimedia')) window.location.href = '/multimedia/dashboard';
        else if (data.user.role === 'superadmin') window.location.href = '/superadmin/dashboard';
        else window.location.href = '/';
      } catch (error) {
        errorText.textContent = error.message;
        errorText.style.display = 'block';
      }
    });
  </script>
</body>
</html>
