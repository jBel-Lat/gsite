<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-login="true">
  <div class="main-content full-width" style="margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;">
    <div class="panel" style="width:min(420px,100%);">
      <div class="panel-header"><h3 class="panel-title">Admin Login</h3></div>
      <form id="loginForm">
        <div class="form-group"><label>Username</label><input class="form-control" name="username" required></div>
        <div class="form-group"><label>Password</label><input class="form-control" name="password" type="password" required></div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
      <p id="errorText" class="alert alert-danger" style="display:none; margin-top:12px;"></p>
      <p style="margin-top:12px;"><a href="/superadmin/login">Login as superadmin</a></p>
    </div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorText = document.getElementById('errorText');

    const roleRedirectMap = {
      superadmin: '/superadmin/dashboard',
      admin: '/admin/dashboard',
      developer_head: '/developer/dashboard',
      developer_member: '/developer/dashboard',
      multimedia_head: '/multimedia/dashboard',
      multimedia_member: '/multimedia/dashboard',
      student: '/student/dashboard',
      panelist: '/student/dashboard',
    };

    const getToken = () => localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');

    const resolveDashboard = (role) => roleRedirectMap[String(role || '').toLowerCase()] || null;

    const storeAuth = (data) => {
      const user = data?.user || null;
      const token = data?.token || null;
      if (token) {
        localStorage.setItem('auth_token', token);
        sessionStorage.setItem('auth_token', token);
      } else {
        localStorage.removeItem('auth_token');
        sessionStorage.removeItem('auth_token');
      }
      if (user) {
        sessionStorage.setItem('auth_user', JSON.stringify(user));
      }
    };

    const showError = (message) => {
      errorText.textContent = message;
      errorText.style.display = 'block';
    };

    const autoRedirectIfLoggedIn = async () => {
      try {
        const headers = {};
        const existingToken = getToken();
        if (existingToken) {
          headers.Authorization = `Bearer ${existingToken}`;
        }
        const response = await fetch('/api/auth/me', { headers });
        const data = await response.json();
        if (!response.ok || data?.ok === false || !data?.user) {
          return;
        }
        const target = resolveDashboard(data.user.role);
        if (target && window.location.pathname !== target) {
          window.location.replace(target);
        }
      } catch (_error) {
        // stay on login page
      }
    };

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorText.style.display = 'none';

      const payload = Object.fromEntries(new FormData(form).entries());
      payload.scope = 'admin';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok === false || data.success === false) {
          throw new Error(data.error || data.message || 'Login failed');
        }

        storeAuth(data);
        const role = data.role || data?.user?.role || '';
        const target = resolveDashboard(role);

        if (!target) {
          throw new Error(`Unknown role "${role || 'none'}". Please contact administrator.`);
        }

        if (window.location.pathname === target) {
          return;
        }

        window.location.assign(target);
      } catch (error) {
        showError(error.message || 'Login failed');
      }
    });

    autoRedirectIfLoggedIn();
  </script>
</body>
</html>
